spring:
  application:
    name: 4inventory-api

  datasource:
    url: jdbc:postgresql://postgres:5432/spring_db
    username: devuser
    password: devpassword

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 5000

api:
  security:
    token:
      secret: ${JWT_SECRET:my-dirt-little-secret}
