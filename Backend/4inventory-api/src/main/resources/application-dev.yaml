spring:
  application:
    name: 4IN-API DEV

  datasource:
    url: jdbc:postgresql://postgres:5432/spring_db
    username: devuser
    password: devpassword

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 5000

api:
  security:
    token:
      secret: ${JWT_SECRET:my-dirt-little-secret}
logging:
  pattern:
    dateformat: dd-MM-yyy HH:mm:ss
  file.name: 4in.log
