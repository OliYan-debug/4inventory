spring:
  application:
    name: 4inventory-api

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 5000

api:
  security:
    token:
      secret: ${JWT_SECRET:my-dirt-little-secret}

logging:
  pattern:
    dateformat: dd-MM-yyy HH:mm:ss